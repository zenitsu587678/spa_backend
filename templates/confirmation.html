<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking confirmed — Luxury Spa</title>
<style>
  body { margin:0; background:#f7f4ef; color:#57514a; font-weight:300;
         font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#fff; border-radius:16px; padding:48px; max-width:520px;
          text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.06); margin:20px; }
  h1 { font-family:Georgia,serif; font-weight:400; color:#2f2b26; font-size:30px; margin:0 0 14px; }
  .ref { display:inline-block; margin:20px 0; padding:10px 20px; background:#f7f4ef;
         border-radius:8px; font-family:ui-monospace,Menlo,monospace; color:#2f2b26; font-size:15px; }
  a { color:#8a7355; }
</style>
</head>
<body>
  <div class="card">
    <h1>Thank you</h1>
    <p>Your appointment request has been received. Please check your email for
       your booking details and secure management links.</p>
    {% if ref %}<div class="ref">{{ ref }}</div>{% endif %}
    <p style="font-size:13px;color:#9b9488;margin-top:26px">
      <a href="/book/">Make another booking</a> &nbsp;·&nbsp;
      <a href="/admin/bookings/booking/">View in admin</a>
    </p>
  </div>
</body>
</html>
